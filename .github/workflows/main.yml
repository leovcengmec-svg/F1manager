name: F1 Team Manager - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download project ZIP
        uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Find project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "F1TeamManager_Android_V30_First_Real_APK_Candidate.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP do projeto não encontrado."
            echo "Arquivos disponíveis:"
            find . -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          mkdir -p project
          unzip -q "$ZIP" -d project

      - name: Locate Android project
        run: |
          SETTINGS=$(find project -name "settings.gradle.kts" -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle.kts não encontrado."
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto Android:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37"
          sdkmanager "build-tools;36.0.0"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            find app/build -type f 2>/dev/null || true
            exit 1
          fi

          echo "===================================="
          echo "APK GERADO COM SUCESSO"
          echo "===================================="
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F1TeamManager-V30-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
