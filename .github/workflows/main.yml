name: F1 Team Manager - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Localizar e extrair projeto V30
        shell: bash
        run: |
          set -euxo pipefail

          ZIP="./F1TeamManager_Android_V30_First_Real_APK_Candidate.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP não encontrado: $ZIP"
            ls -la
            exit 1
          fi

          rm -rf project
          mkdir -p project
          unzip -q "$ZIP" -d project

          SETTINGS="$(find project -name settings.gradle.kts -type f -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle.kts não encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERRO: app/build.gradle.kts não encontrado."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Configurar ferramentas Android
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: ""
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Instalar SDK necessário
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="$(command -v sdkmanager)"

          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            --channel=0 \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verificar SDK
        shell: bash
        run: |
          set -euxo pipefail

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"

          echo "Android SDK OK"

      - name: Compilar APK Debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verificar APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "======================================"
          echo "APK GERADO COM SUCESSO"
          echo "======================================"

          ls -lh "$APK"
          file "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: F1TeamManager-V30-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
